<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Core Technologies — META AIVI</title>
<meta name="description" content="Our tech stack: Smart Electrical Systems, IoT for Manufacturing, AI Vision, REFI Electrical Fault Isolator.">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header><div class="wrap"><div class="logo">META <span>AIVI</span></div><nav id="nav"></nav></div></header>
<section><div class="wrap">
  <h2 class="section-title" id="t"></h2>
  <div class="grid" id="grid"></div>
</div></section>
<footer id="footer"></footer>
<a class="whatsapp-float" id="wa" target="_blank">💬 WhatsApp</a>
<script src="../assets/js/cms.js"></script>
<script>(async()=>{const c=await CMS.loadContent();
document.getElementById('nav').innerHTML=CMS.renderNav(c.nav,'Core Technologies');
document.getElementById('t').textContent=c.technologies.title;
document.getElementById('grid').innerHTML=c.technologies.items.map(i=>
  `<div class="card"><h3>${i.name}</h3><p>${i.desc}</p></div>`).join('');
document.getElementById('footer').innerHTML=CMS.renderFooter(c.site);
document.getElementById('wa').href=CMS.waLink(c.site.whatsapp);})();</script>
</body></html>
